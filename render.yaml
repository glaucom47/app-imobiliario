# Render Blueprint - Fecho (fecho.pt)
# Infraestrutura como código para publicação contínua (PaaS)
services:
  - type: web
    name: fecho-app
    env: python
    region: frankfurt # Servidor europeu ideal para conformidade RGPD e baixa latência em Portugal
    plan: starter
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: fecho-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: CORS_ORIGINS
        value: "https://fecho.pt,https://www.fecho.pt"
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: fecho-db
    plan: starter
    region: frankfurt
    databaseName: fecho_db
    user: fecho_user
    postgresMajorVersion: 15
